name: Build & Release FreeShow AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend:prod

      - name: Build servers
        run: npm run build:servers:prod

      - name: Build Electron
        run: npm run build:electron:prod

      - name: Build AppImage
        run: npm run release:local
        env:
          NODE_ENV: production

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeShow-AppImage
          path: dist/*.AppImage
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: FreeShow-AppImage
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false